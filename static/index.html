<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSC</title>
<script>
  // Day (6am-7pm on your clock) is white with black; night is black with white.
  function applyTheme() {
    const hour = new Date().getHours();
    document.documentElement.dataset.theme = hour >= 6 && hour < 19 ? "light" : "dark";
  }
  applyTheme();
  setInterval(applyTheme, 60 * 1000);
</script>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --text: #000000;
    --muted: #666666;
    --border: #d9d9d9;
    --accent: #000000;
    --accent-text: #ffffff;
    --user-bubble: #000000;
    --user-text: #ffffff;
    --bot-bubble: #ffffff;
    --code: #f2f2f2;
    --error: #c2362b;
  }
  :root { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --panel: #0d0d0d;
    --text: #ffffff;
    --muted: #999999;
    --border: #333333;
    --accent: #ffffff;
    --accent-text: #000000;
    --user-bubble: #ffffff;
    --user-text: #000000;
    --bot-bubble: #141414;
    --code: #1f1f1f;
    --error: #f0786d;
  }
  :root[data-theme="dark"] body { background-image: url("/static/doodle-dark.svg"); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--bg);
    background-image: url("/static/doodle-light.svg");
    background-size: 280px 280px;
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-weight: 700;
  }
  .title { font-weight: 650; font-size: 16px; }
  .mode { font-size: 12px; color: var(--muted); }
  .actions { margin-left: auto; display: flex; gap: 8px; }

  button {
    font: inherit; font-size: 14px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }

  main { flex: 1; overflow-y: auto; }
  #messages {
    max-width: 760px; margin: 0 auto; padding: 24px 16px 12px;
    display: flex; flex-direction: column; gap: 14px;
  }

  .welcome { text-align: center; padding: 40px 0 8px; }
  .welcome h1 { font-size: 24px; margin: 0 0 6px; }
  .welcome p { color: var(--muted); margin: 0 auto; max-width: 460px; }

  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere;
  }
  .user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bot .bubble p { margin: 0 0 8px; }
  .bot .bubble p:last-child { margin-bottom: 0; }
  .bot .bubble ul, .bot .bubble ol { margin: 4px 0 8px; padding-left: 22px; }
  .bot .bubble code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13.5px; }
  .bot .bubble pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .bot .bubble pre code { background: none; padding: 0; }
  .error .bubble { color: var(--error); }

  .files { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; justify-content: flex-end; }
  .files img, .files video { max-width: 220px; max-height: 220px; border-radius: 10px; border: 1px solid var(--border); display: block; }
  .file {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px;
    max-width: 260px;
  }
  .file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pending { max-width: 760px; margin: 0 auto 8px; justify-content: flex-start; }
  #pending:empty { display: none; }
  #pending .file { padding: 4px 4px 4px 6px; }
  #pending img, #pending video { width: 36px; height: 36px; object-fit: cover; border-radius: 5px; border: 0; }
  #pending button { border: 0; background: none; padding: 0 5px; color: var(--muted); font-size: 16px; line-height: 1; }
  form button.attach { background: none; color: var(--muted); font-size: 20px; padding: 4px 8px; font-weight: 400; }
  form button.attach:hover { color: var(--text); }
  body.dragging main { outline: 2px dashed var(--accent); outline-offset: -8px; }

  .typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  footer { padding: 8px 16px 16px; }
  form {
    position: relative;
    max-width: 760px; margin: 0 auto; display: flex; gap: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px;
  }
  form:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; padding: 6px 8px; max-height: 160px;
  }
  form button { background: var(--accent); color: var(--accent-text); border: 0; font-weight: 600; padding: 8px 16px; }
  form button:disabled { opacity: .5; cursor: default; }
  .attach-menu {
    position: absolute; left: 8px; bottom: calc(100% + 8px); z-index: 5;
    min-width: 230px; padding: 6px; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
  }
  .attach-menu[hidden] { display: none; }
  form .attach-menu button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; color: var(--text); font-weight: 400; padding: 9px 10px; border-radius: 8px;
  }
  form .attach-menu button:hover, form .attach-menu button:focus-visible { background: var(--code); outline: none; }
  .attach-menu .icon { font-size: 18px; width: 22px; text-align: center; }
  .attach-menu small { display: block; color: var(--muted); font-size: 12px; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <div>
    <div class="title">SSC</div>
    <div class="mode" id="mode">connecting…</div>
  </div>
  <div class="actions">
    <button id="reset" type="button">New chat</button>
    <button id="signout" type="button" hidden>Sign out</button>
  </div>
</header>

<main id="scroller">
  <div id="messages">
    <div class="welcome" id="welcome">
      <h1>Hi, I'm SSC</h1>
      <p>I can check the weather and time, look things up, do maths, remember things about you, and read your photos, videos and files.</p>
    </div>
  </div>
</main>

<footer>
  <div class="files" id="pending"></div>
  <form id="form">
    <button class="attach" id="attach" type="button" title="Attach" aria-label="Attach" aria-haspopup="menu" aria-expanded="false" aria-controls="attach-menu">📎</button>
    <div class="attach-menu" id="attach-menu" role="menu" hidden>
      <button type="button" role="menuitem" data-picker="pick-media"><span class="icon">🖼️</span><span>Photos &amp; videos<small>PNG, JPG, GIF, WebP, MP4, MOV</small></span></button>
      <button type="button" role="menuitem" data-picker="pick-files"><span class="icon">📄</span><span>Files<small>PDF, text, CSV, code</small></span></button>
      <button type="button" role="menuitem" data-picker="pick-other"><span class="icon">📁</span><span>Other<small>Any other file</small></span></button>
    </div>
    <input id="pick-media" type="file" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/quicktime,video/webm">
    <input id="pick-files" type="file" multiple hidden accept=".pdf,.txt,.md,.csv,.json,.py,.js,.ts,.html,.css,.xml,.yaml,.yml,.log">
    <input id="pick-other" type="file" multiple hidden>
    <textarea id="input" rows="1" placeholder="Message SSC…" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="hint">Enter to send · Shift+Enter for a new line · 📎 or drop photos, videos and files to ask about them</div>
</footer>

<script>
  const messages = document.getElementById("messages");
  const scroller = document.getElementById("scroller");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let session = crypto.randomUUID();
  let busy = false;
  let pending = [];  // attachments waiting to be sent: {name, type, data, url}
  const MAX_FILE = 10 * 1024 * 1024;

  fetch("/api/info").then(r => {
    if (r.status === 401) { location.replace("/login"); throw new Error("signed out"); }
    return r.json();
  }).then(d => {
    document.getElementById("mode").textContent = d.mode;
    document.getElementById("signout").hidden = !d.sign_in;
  }).catch(() => {
    document.getElementById("mode").textContent = "server not running";
  });

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // Small, safe markdown: code blocks, inline code, bold, italics, lists, paragraphs.
  function renderMarkdown(text) {
    const blocks = [];
    text = text.replace(/```\w*\n?([\s\S]*?)```/g, (_, code) => {
      blocks.push(`<pre><code>${escapeHtml(code.trimEnd())}</code></pre>`);
      return `\u0000${blocks.length - 1}\u0000`;
    });
    const inline = s => escapeHtml(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<em>$2</em>");
    return text.split(/\n{2,}/).map(chunk => {
      const lines = chunk.split("\n");
      const m = chunk.trim().match(/^\u0000(\d+)\u0000$/);
      if (m) return blocks[+m[1]];
      if (lines.every(l => /^\s*[-*•]\s+/.test(l)))
        return "<ul>" + lines.map(l => `<li>${inline(l.replace(/^\s*[-*•]\s+/, ""))}</li>`).join("") + "</ul>";
      if (lines.every(l => /^\s*\d+[.)]\s+/.test(l)))
        return "<ol>" + lines.map(l => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ""))}</li>`).join("") + "</ol>";
      return `<p>${lines.map(inline).join("<br>")}</p>`;
    }).join("").replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
  }

  function fileTile(f) {
    if (f.type.startsWith("video/")) {
      const video = document.createElement("video");
      video.src = f.url; video.title = f.name; video.muted = true;
      video.playsInline = true; video.preload = "metadata";
      return video;
    }
    if (f.type.startsWith("image/")) {
      const img = document.createElement("img");
      img.src = f.url; img.alt = f.name; img.title = f.name;
      return img;
    }
    const tile = document.createElement("div");
    tile.className = "file";
    tile.innerHTML = `📄 <span></span>`;
    tile.querySelector("span").textContent = f.name;
    tile.title = f.name;
    return tile;
  }

  function addMessage(role, html, files = []) {
    document.getElementById("welcome")?.remove();
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;
    if (files.length) {
      const row = document.createElement("div");
      row.className = "files";
      files.forEach(f => {
        const tile = fileTile(f);
        if (tile.tagName === "VIDEO") tile.controls = true;
        row.appendChild(tile);
      });
      msg.appendChild(row);
    }
    if (html === null) { messages.appendChild(msg); scroller.scrollTop = scroller.scrollHeight; return msg; }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = html;
    msg.appendChild(bubble);
    messages.appendChild(msg);
    scroller.scrollTop = scroller.scrollHeight;
    return msg;
  }

  async function ask(text) {
    if (busy || (!text.trim() && !pending.length)) return;
    busy = true; send.disabled = true;
    const files = pending;
    pending = []; renderPending();
    addMessage("user", text.trim() ? escapeHtml(text) : null, files);
    input.value = ""; autosize();
    const typing = addMessage("bot", '<div class="typing"><span></span><span></span><span></span></div>');
    typing.querySelector(".bubble").style.padding = "0";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text, session, attachments: files.map(({name, type, data}) => ({name, type, data}))}),
      });
      const data = await res.json();
      typing.remove();
      if (data.signed_out) { location.replace("/login"); return; }
      if (data.error) addMessage("bot error", escapeHtml(data.error));
      else addMessage("bot", renderMarkdown(data.answer));
    } catch {
      typing.remove();
      addMessage("bot error", "Can't reach the SSC server. Is ./run_web.sh still running?");
    }
    busy = false; send.disabled = false; input.focus();
  }

  function renderPending() {
    const box = document.getElementById("pending");
    box.innerHTML = "";
    pending.forEach((f, i) => {
      const chip = document.createElement("div");
      chip.className = "file";
      if (f.type.startsWith("image/") || f.type.startsWith("video/")) chip.appendChild(fileTile(f));
      const name = document.createElement("span");
      name.textContent = f.name;
      const x = document.createElement("button");
      x.type = "button"; x.textContent = "×"; x.title = "Remove"; x.setAttribute("aria-label", `Remove ${f.name}`);
      x.addEventListener("click", () => { pending.splice(i, 1); renderPending(); });
      chip.append(name, x);
      box.appendChild(chip);
    });
  }

  function addFiles(list) {
    for (const file of list) {
      if (file.size > MAX_FILE) { addMessage("bot error", escapeHtml(`'${file.name}' is too big (max 10 MB).`)); continue; }
      const reader = new FileReader();
      reader.onload = () => {
        const url = reader.result;
        pending.push({name: file.name || "pasted-image.png", type: file.type || "", data: url.slice(url.indexOf(",") + 1), url});
        renderPending();
      };
      reader.readAsDataURL(file);
    }
    input.focus();
  }

  const attachBtn = document.getElementById("attach");
  const attachMenu = document.getElementById("attach-menu");
  function setMenu(open) {
    attachMenu.hidden = !open;
    attachBtn.setAttribute("aria-expanded", String(open));
    if (open) attachMenu.querySelector("button").focus();
  }
  attachBtn.addEventListener("click", () => setMenu(attachMenu.hidden));
  attachMenu.querySelectorAll("button").forEach(item => item.addEventListener("click", () => {
    setMenu(false);
    document.getElementById(item.dataset.picker).click();
  }));
  document.addEventListener("click", e => {
    if (!attachMenu.hidden && !attachMenu.contains(e.target) && e.target !== attachBtn) setMenu(false);
  });
  attachMenu.addEventListener("keydown", e => {
    const items = [...attachMenu.querySelectorAll("button")];
    const i = items.indexOf(document.activeElement);
    if (e.key === "Escape") { setMenu(false); attachBtn.focus(); }
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  });
  ["pick-media", "pick-files", "pick-other"].forEach(id => {
    const input = document.getElementById(id);
    input.addEventListener("change", () => { addFiles(input.files); input.value = ""; });
  });
  input.addEventListener("paste", e => {
    const files = [...e.clipboardData.files];
    if (files.length) { e.preventDefault(); addFiles(files); }
  });
  let dragDepth = 0;
  document.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
  document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    addFiles(e.dataTransfer.files);
  });

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
  });
  document.getElementById("signout").addEventListener("click", async () => {
    await fetch("/api/logout", {method: "POST"}).catch(() => {});
    location.replace("/login");
  });
  document.getElementById("reset").addEventListener("click", async () => {
    await fetch("/api/reset", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({session})}).catch(() => {});
    location.reload();
  });
</script>
</body>
</html>
